name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.403
          cache: true
          cache-dependency-path: src/Gyroid/packages.lock.json
      - run: dotnet new globaljson --sdk-version 10.0.403 --roll-forward disable --force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: spirv-val-linux-x64-1.4.357.0-9a49b0883b9b635689a85b5647dbfcb223268151
      - run: bash scripts/install-shader-tools.sh
      - run: bash scripts/verify.sh
      - run: bash scripts/release-linux.sh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-x64
          path: |
            artifacts/release/*.tar.gz
            artifacts/release/release-notes.md
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-accesskit-unstripped
          path: artifacts/release/libgoo-accesskit-*.so.unstripped
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.403
          cache: true
          cache-dependency-path: src/Gyroid/packages.win-x64.lock.json
      - run: dotnet new globaljson --sdk-version 10.0.403 --roll-forward disable --force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: spirv-val-linux-x64-1.4.357.0-9a49b0883b9b635689a85b5647dbfcb223268151
      - run: bash scripts/install-shader-tools.sh
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wine64 wine
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/xwin/splat
          key: xwin-0.10.0-sdk-10.0.26100-crt-14.44.17.14-linux-x64
      - run: bash scripts/install-windows-tools.sh
      - run: bash scripts/release-windows.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win-x64
          path: artifacts/release/*.zip
          if-no-files-found: error
          retention-days: 1

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NuGetLockFilePath: ${{ github.workspace }}/src/Gyroid/packages.osx-arm64.lock.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/Gyroid/packages.osx-arm64.lock.json
      - run: test "$(uname -m)" = arm64
      - run: bash scripts/install-shader-tools.sh
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/goo" Goo.DevTools --version 0.27.2
      - run: bash scripts/verify.sh
      - run: bash scripts/generate-macos-icon.sh
      - name: Package NativeAOT app and DMG
        run: |
          dotnet restore src/Gyroid/Gyroid.gsproj -r osx-arm64 --locked-mode
          "$RUNNER_TEMP/goo/goo" package --project src/Gyroid/Gyroid.gsproj --target macos --output "$GITHUB_WORKSPACE/artifacts/macos"
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("src/Gyroid/Gyroid.gsproj").findtext("PropertyGroup/Version"))')
          mkdir -p artifacts/release
          mv "artifacts/macos/dev.gyroid.wallet-$version-osx-arm64.dmg" "artifacts/release/gyroid-$version-macos-arm64.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm64
          path: artifacts/release/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Smoke installed app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/gyroid-core.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          asset=blocknet-core-arm64-macos-0.23.0.zip
          gh release download v0.23.0 --repo blocknetprivacy/core --pattern "$asset" --pattern SHA256SUMS.txt --dir "$work"
          unset GH_TOKEN
          (cd "$work" && grep -F " $asset" SHA256SUMS.txt | shasum -a 256 -c -)
          unzip -q "$work/$asset" -d "$work"
          chmod 700 "$work/blocknet-core-arm64-macos"
          GYROID_BINARY="$work/blocknet-core-arm64-macos" bash scripts/verify-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-smoke
          path: artifacts/macos-smoke/
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Check all archives
        working-directory: artifacts/release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          sha256sum "gyroid-$version-linux-x64.tar.gz" "gyroid-$version-win-x64.zip" "gyroid-$version-macos-arm64.dmg" > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf '\n## macOS Apple silicon\n\nRequires Apple silicon and macOS 14 or later. No .NET runtime is required. Copy Gyroid.app from the DMG to Applications. The app is ad-hoc signed and is not notarized. On first launch, use Settings > Privacy & Security > Open Anyway if macOS blocks it.\n' >> release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/*.dmg artifacts/release/SHA256SUMS --verify-tag --draft --generate-notes --notes-file artifacts/release/release-notes.md --title "Gyroid $RELEASE_TAG"
