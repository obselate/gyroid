name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: src/Gyroid/packages.lock.json
      - run: dotnet new globaljson --sdk-version 10.0.401 --roll-forward disable --force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: spirv-val-linux-x64-1.4.357.0-9a49b0883b9b635689a85b5647dbfcb223268151
      - run: bash scripts/install-shader-tools.sh
      - run: bash scripts/verify.sh
      - run: bash scripts/release-linux.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-x64
          path: |
            artifacts/release/*.tar.gz
            artifacts/release/release-notes.md
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: src/Gyroid/packages.win-x64.lock.json
      - run: dotnet new globaljson --sdk-version 10.0.401 --roll-forward disable --force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: spirv-val-linux-x64-1.4.357.0-9a49b0883b9b635689a85b5647dbfcb223268151
      - run: bash scripts/install-shader-tools.sh
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wine64 wine
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/xwin/splat
          key: xwin-0.10.0-sdk-10.0.26100-crt-14.44.17.14-linux-x64
      - run: bash scripts/install-windows-tools.sh
      - run: bash scripts/release-windows.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win-x64
          path: artifacts/release/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Check both archives
        working-directory: artifacts/release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          sha256sum "gyroid-$version-linux-x64.tar.gz" "gyroid-$version-win-x64.zip" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS --verify-tag --draft --generate-notes --notes-file artifacts/release/release-notes.md --title "Gyroid $RELEASE_TAG"
