name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        id: metadata
      - if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-names != '' &&
          !contains(steps.metadata.outputs.dependency-names, 'Gsharp.NET.Sdk')
        run: |
          gh api graphql \
            -f query='mutation($id: ID!, $head: GitObjectID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, expectedHeadOid: $head, mergeMethod: SQUASH}) {
                clientMutationId
              }
            }' \
            -f id="$PR_ID" -f head="$PR_HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
