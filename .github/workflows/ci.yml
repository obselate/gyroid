name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/Gyroid/packages.lock.json
      - name: Install Slang
        run: |
          curl -fsSLo "$RUNNER_TEMP/slang.tar.gz" https://github.com/shader-slang/slang/releases/download/v2026.16/slang-2026.16-linux-x86_64-glibc-2.28.tar.gz
          echo "0eb4ab135bdd1c0578ee394eaf4b19926a89be99f99b59f09fe717e0afbd094a  $RUNNER_TEMP/slang.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          echo "SLANG_SDK=$RUNNER_TEMP/slang" >> "$GITHUB_ENV"
      - run: bash scripts/verify.sh
