name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/Gyroid/packages.lock.json
      - name: Install Slang
        run: |
          curl -fsSLo "$RUNNER_TEMP/slang.tar.gz" https://github.com/shader-slang/slang/releases/download/v2026.16/slang-2026.16-linux-x86_64-glibc-2.27.tar.gz
          echo "b9c5e195ce9a7124147d47febe78b7f8c59c96829add50b0938bd04b8056fb88  $RUNNER_TEMP/slang.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          echo "SLANG_SDK=$RUNNER_TEMP/slang" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: spirv-val
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: spirv-val-linux-x64-1.4.357.0-9a49b0883b9b635689a85b5647dbfcb223268151
      - name: Install spirv-val
        if: steps.spirv-val.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo "$RUNNER_TEMP/vulkan-sdk.tar.xz" https://sdk.lunarg.com/sdk/download/1.4.357.0/linux/vulkan_sdk.tar.xz
          echo "0f09bf6a0625e346bf004be70b92907e934a4c76606b323441b2baf3a5a0e66d  $RUNNER_TEMP/vulkan-sdk.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vulkan-sdk/bin"
          tar -xJf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk/bin" --strip-components=3 1.4.357.0/x86_64/bin/spirv-val
          rm "$RUNNER_TEMP/vulkan-sdk.tar.xz"
      - run: echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-sdk" >> "$GITHUB_ENV"
      - run: bash scripts/verify.sh
